name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # نسخه‌ی Gradle مستقیماً نصب می‌شود؛ نیازی به commit کردن gradle-wrapper.jar نیست.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Lint, unit tests, debug APK
        run: gradle --no-daemon --stacktrace lintDebug test assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lightlink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
